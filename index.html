<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Akıllı Görsel Sözlük</title>

<style>
body {
    background:#0b1220;
    color:white;
    font-family:Arial;
    text-align:center;
}

input {
    padding:15px;
    width:300px;
    border-radius:10px;
    border:none;
    font-size:18px;
    margin-top:40px;
}

#results {
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card {
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    width:200px;
}

.card img {
    width:100%;
    border-radius:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>🧠 Akıllı Görsel Sözlük</h1>

<input type="text" id="search" placeholder="Kelime yaz...">

<div id="results"></div>

<script>
let words = [];

// words.txt yükle
fetch("words.txt")
.then(res => res.text())
.then(data => {
    words = data.split("\n").map(line => {
        let parts = line.split(",");
        return {
            de: parts[0],
            en: parts[1],
            tr: parts[2]
        };
    });
});

// elementler
const input = document.getElementById("search");
const results = document.getElementById("results");

// yazarken arama
input.addEventListener("input", () => {
    let val = input.value.toLowerCase();
    results.innerHTML = "";

    if(val.length < 1) return;

    let filtered = words.filter(w =>
        w.de.toLowerCase().includes(val) ||
        w.en.toLowerCase().includes(val) ||
        w.tr.toLowerCase().includes(val)
    ).slice(0, 6);

    filtered.forEach(w => {
        let div = document.createElement("div");
        div.className = "card";

        let img = `https://source.unsplash.com/300x200/?${w.en}`;

        div.innerHTML = `
            <b>${w.de}</b><br>
            🇬🇧 ${w.en}<br>
            🇹🇷 ${w.tr}
            <img src="${img}">
        `;

        results.appendChild(div);
    });
});
</script>

</body>
</html>
