<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Deutsch6000 AI</title>

<style>
body {
    background:#0b1220;
    color:white;
    font-family:Arial;
    text-align:center;
}

input {
    padding:15px;
    width:300px;
    border-radius:10px;
    border:none;
    font-size:18px;
}

#suggestions {
    margin-top:20px;
}

.card {
    background:#1e293b;
    padding:15px;
    margin:10px auto;
    width:300px;
    border-radius:12px;
    cursor:pointer;
}

.card:hover {
    background:#334155;
}

img {
    width:100%;
    border-radius:10px;
    margin-top:10px;
}
</style>
</head>

<body>

<h1>DEUTSCH6000 🔥</h1>
<p>Yazmaya başla → görsel + anlam gelsin</p>

<input id="search" placeholder="Kelime yaz...">

<div id="suggestions"></div>

<script>
let words = [];

// words.txt dosyasını çek
fetch("words.txt")
.then(res => res.text())
.then(data => {
    words = data.split("\n").map(line => {
        let parts = line.split(",");
        return {
            de: parts[0],
            en: parts[1],
            tr: parts[2]
        };
    });
});

const input = document.getElementById("search");
const box = document.getElementById("suggestions");

input.addEventListener("input", () => {
    let val = input.value.toLowerCase();
    box.innerHTML = "";

    if(val.length < 1) return;

    let filtered = words.filter(w => 
        w.de.toLowerCase().includes(val) ||
        w.en.toLowerCase().includes(val) ||
        w.tr.toLowerCase().includes(val)
    ).slice(0,5);

    filtered.forEach(w => {
        let div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <b>${w.de}</b><br>
            🇬🇧 ${w.en} <br>
            🇹🇷 ${w.tr}
            <img src="https://source.unsplash.com/300x200/?${w.en}">
        `;

        box.appendChild(div);
    });
});
</script>

</body>
</html>
