<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akıllı Görsel Sözlük</title>

<style>
body {
    background:#0b1220;
    color:white;
    font-family:Arial;
    text-align:center;
    margin:0;
}

h1 {
    margin-top:30px;
}

input {
    padding:15px;
    width:320px;
    max-width:90%;
    border-radius:12px;
    border:none;
    font-size:18px;
    margin-top:30px;
    outline:none;
}

#results {
    margin-top:30px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card {
    background:#1e293b;
    padding:15px;
    border-radius:12px;
    width:200px;
    transition:0.2s;
}

.card:hover {
    transform:scale(1.05);
}

.card img {
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.empty {
    opacity:0.6;
    margin-top:20px;
}
</style>
</head>

<body>

<h1>🧠 Akıllı Görsel Sözlük</h1>

<input type="text" id="search" placeholder="Kelime yaz...">

<div id="results"></div>

<script>
let words = [];
const input = document.getElementById("search");
const results = document.getElementById("results");

// DATA YÜKLE
fetch("words.txt")
.then(res => res.text())
.then(data => {
    words = data.split("\n")
        .filter(line => line.trim() !== "")
        .map(line => {
            const parts = line.split(",");
            return {
                de: parts[0]?.trim() || "",
                en: parts[1]?.trim() || "",
                tr: parts[2]?.trim() || ""
            };
        });
})
.catch(err => {
    results.innerHTML = "<div class='empty'>⚠️ words.txt yüklenemedi</div>";
    console.error(err);
});

// ARAMA
input.addEventListener("input", () => {
    const val = input.value.toLowerCase().trim();
    results.innerHTML = "";

    if (val.length === 0) {
        results.innerHTML = "<div class='empty'>Kelime yazmaya başla...</div>";
        return;
    }

    const filtered = words.filter(w =>
        (w.de && w.de.toLowerCase().includes(val)) ||
        (w.en && w.en.toLowerCase().includes(val)) ||
        (w.tr && w.tr.toLowerCase().includes(val))
    ).slice(0, 8);

    if (filtered.length === 0) {
        results.innerHTML = "<div class='empty'>Sonuç bulunamadı</div>";
        return;
    }

    filtered.forEach(w => {
        const div = document.createElement("div");
        div.className = "card";

        const img = `https://source.unsplash.com/300x200/?${encodeURIComponent(w.en)}&sig=${Math.random()}`;

        div.innerHTML = `
            <b>${w.de}</b><br>
            🇬🇧 ${w.en}<br>
            🇹🇷 ${w.tr}
            <img src="${img}" loading="lazy">
        `;

        results.appendChild(div);
    });
});
</script>

</body>
</html>
<!-- deploy trigger -->
