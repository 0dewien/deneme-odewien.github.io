<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Deutsch6000</title>

<style>
body {
  background: #0b1220;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 40px;
}

input {
  padding: 12px;
  border-radius: 10px;
  border: none;
  width: 300px;
}

#results {
  margin-top: 15px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
}

.result {
  padding: 10px;
  border-bottom: 1px solid #222;
}

.result:hover {
  background: #222;
}
</style>
</head>

<body>

<h1>DEUTSCH6000</h1>

<input type="text" id="search" placeholder="Kelime yaz (Haus)">

<div id="results"></div>

<script>
let words = [];

// VERİYİ YÜKLE
fetch("words.txt")
  .then(res => res.text())
  .then(text => {
    words = text.split("\n").map(line => {
      let [de, en, tr] = line.split(",");
      return { de, en, tr };
    });
  });

// CANLI ARAMA
document.getElementById("search").addEventListener("input", function () {
  const value = this.value.toLowerCase();
  const resultsDiv = document.getElementById("results");

  resultsDiv.innerHTML = "";

  if (!value) return;

  const filtered = words.filter(w =>
    w.de.toLowerCase().includes(value) ||
    w.en.toLowerCase().includes(value) ||
    w.tr.toLowerCase().includes(value)
  );

  filtered.slice(0, 10).forEach(w => {
    const div = document.createElement("div");
    div.className = "result";
    div.innerHTML = `<b>${w.de}</b> → ${w.en} → ${w.tr}`;
    resultsDiv.appendChild(div);
  });
});
</script>

</body>
</html>
