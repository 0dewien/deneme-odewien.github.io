<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEUTSCH6000</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: #fff;
  text-align: center;
  padding: 40px;
}

h1 {
  font-size: 40px;
  color: #4ade80;
}

.card {
  margin-top: 30px;
  padding: 20px;
  background: #111827;
  border-radius: 15px;
  display: inline-block;
  width: 300px;
}

button {
  margin-top: 20px;
  padding: 10px 20px;
  border: none;
  border-radius: 10px;
  background: #6366f1;
  color: white;
  cursor: pointer;
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
  width: 200px;
}
</style>
</head>

<body>

<h1>DEUTSCH6000</h1>
<p>6000 KELİME HAZIR ✓</p>

<input id="search" placeholder="Kelime ara...">
<br>
<button onclick="searchWord()">Ara</button>

<div class="card" id="result">
Kelime arayın
</div>

<script>

// 🔥 DEMO VERİ (çalıştığını görmek için)
const words = [
  {de:"Haus", en:"house", tr:"ev"},
  {de:"Hund", en:"dog", tr:"köpek"},
  {de:"Katze", en:"cat", tr:"kedi"},
  {de:"Buch", en:"book", tr:"kitap"},
  {de:"Wasser", en:"water", tr:"su"}
];

function searchWord() {
  const input = document.getElementById("search").value.toLowerCase();
  const found = words.find(w => w.de.toLowerCase() === input);

  const result = document.getElementById("result");

  if(found){
    result.innerHTML = `
      <h2>${found.de}</h2>
      <p>EN: ${found.en}</p>
      <p>TR: ${found.tr}</p>
    `;
  } else {
    result.innerHTML = "Kelime bulunamadı";
  }
}

</script>

</body>
</html>
